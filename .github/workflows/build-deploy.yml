jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DATABASE_NAME }}_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    environment:
      name: testing
    env:
      DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      DATABASE_IP_ADDRESS: ${{ secrets.DATABASE_IP_ADDRESS }}
      DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
      DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
      SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS_KEY }}
      ALGORITHM: ${{ secrets.ALGORITHM }}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}

    steps:
      - name: pull git repo
        uses: actions/checkout@v7

      - name: install python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: update pip
        run: python -m pip install --upgrade pip

      - name: install all dependencies from requiremnts.txt
        run: pip install -r requirements.txt

      - name: test with pytest
        run: |
          pip install pytest
          pytest -v

      # - name: Login to DockerHub
      #   uses: docker/login-action@v4
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      # - name: Set up Docker BuildX
      #   id: buildx
      #   uses: docker/setup-buildx-action@v4

      # - name: Build and Push
      #   id: docker_build
      #   uses: docker/build-push-action@v7
      #   with:
      #     context: ./
      #     file: ./Dockerfile
      #     builder: ${{ steps.buildx.outputs.name }}
      #     push: true
      #     tags: ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-actions:latest
      #     cache-from: type=local,src=/tmp/.buildx-cache
      #     cache-to: type=local,dest=/tmp/.buildx-cache

      # - name: Image Digest
      #   run: echo ${{ steps.docker_build.outputs.digest }}

  deploy:
    runs-on: ubuntu-latest

    needs: [build]

    environment:
      name: production

    steps:
      - name: deploying stuff
        run: echo "deploying some stuff"

      - name: Deploy to Ubuntu Server Virtual Box
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          password: ${{ secrets.PROD_PASSWORD }}
          port: ${{ secrets.PROD_PORT }}
          script: |
            cd app/app
            git pull --rebase origin main
            echo ${{secrets.PROD_PASSWORD}} | sudo -S systemctl restart fastapi.service
