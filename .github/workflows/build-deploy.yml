name: Build and Deploy code

# on:
#   push:
#     branches: ["main", "another_branch"]
#   pull_request:
#     branches:
#       - "main"
#       - "another_branch"

on: [push, pull_request]

#global scope for environment variable
# env:
#   DATABASE_USERNAME: postgres
#   DATABASE_PASSWORD: password1234
#   DATABASE_IP_ADDRESS: localhost
#   DATABASE_PORT: 5432
#   DATABASE_NAME: Fastapi
#   SECRET_ACCESS_KEY: o9aLLhHKKfsFL451sliJHGafFla25fchUSD551aetFVSZR2sHF
#   ALGORITHM: HS256
#   ACCESS_TOKEN_EXPIRE_MINUTES: 30

jobs:
  job1:
    runs-on: ubuntu-latest
    environment:
      name: testing
    env:
      DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
      DATABASE_PASSWORD: ${{secrets.DATABASE_PASSWORD}}
      DATABASE_IP_ADDRESS: ${{secrets.DATABASE_IP_ADDRESS}}
      DATABASE_PORT: ${{secrets.DATABASE_PORT}}
      DATABASE_NAME: ${{secrets.DATABASE_NAME}}
      SECRET_ACCESS_KEY: ${{secrets.SECRET_ACCESS_KEY}}
      ALGORITHM: ${{secrets.ALGORITHM}}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${{secrets.ACCESS_TOKEN_EXPIRE_MINUTES}}

    steps:
      - name: pull git repo
        uses: actions/checkout@v7

      - name: install python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: update pip
        run: python -m pip install --upgrade pip

      - name: install all dependencies
        run: pip install -r requirements.txt

      - name: test with pytest
        run: |
          pip install pytest
          pytest -v
